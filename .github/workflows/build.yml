name: build

on:
  workflow_dispatch:
  push:
    branches:
      - fongmi
      - codex/libxml2-dash-build
  pull_request:
    branches:
      - fongmi

env:
  MPV_GIT_URL: https://github.com/FongMi/mpv
  MPV_GIT_REF: fongmi
  MPV_ANDROID_ARCHES: armv7l arm64

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Export env vars
        run: buildscripts/include/ci.sh export >>$GITHUB_ENV

      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/mpv-android-cache/
          key: "${{ env.CACHE_IDENTIFIER }}"
          enableCrossOsArchive: true

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install autoconf pkgconf libtool ninja-build cmake python3-pip gperf
          sudo pip3 install meson

      - name: Download or build deps
        run: |
          mkdir -p "$CACHE_FOLDER"
          buildscripts/include/ci.sh install
        env:
          CACHE_MODE: "folder"
          CACHE_FOLDER: "${{ runner.temp }}/mpv-android-cache"

      - name: Build native libraries
        env:
          MPV_ANDROID_NATIVE_ONLY: "1"
        run: |
          buildscripts/include/ci.sh build

      - name: Verify libxml2 and native DASH support
        run: |
          set -euo pipefail
          for arch in armv7l arm64; do
            strings "buildscripts/prefix/$arch/lib/libavformat.so" | grep -F -- '--enable-libxml2'
            strings "buildscripts/prefix/$arch/lib/libavformat.so" | grep -Fx 'Dynamic Adaptive Streaming over HTTP'
          done
          for abi in armeabi-v7a arm64-v8a; do
            test -s "app/src/main/libs/$abi/libmpv.so"
            if strings "app/src/main/libs/$abi/libmpv.so" | grep -F 'configured without libxml2'; then
              echo "libmpv for $abi still reports configured without libxml2" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-android-fongmi
          path: app/src/main/libs/**/*.so
          if-no-files-found: error
